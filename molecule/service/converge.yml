---
# Run `install.sh --service` with a PATH whose first entry is the curl stub, so
# the "download" happens offline and the requested URL is recorded. The backend
# URL and token come from the installer's non-interactive env vars — there is no
# TTY in a molecule run.
- name: Run install.sh --service against the offline curl stub
  hosts: all
  gather_facts: false
  become: false

  vars:
    stage_dir: /opt/molecule
    stub_bin_dir: /opt/molecule/stub-bin
    install_log: /opt/molecule/install.log
    install_rc: /opt/molecule/install.rc
    backend_base: https://llm.example.test
    backend_key: molecule-test-token

  tasks:
    - name: Truncate the stub call log before the single installer run
      ansible.builtin.copy:
        content: ""
        dest: "{{ stage_dir }}/curl-calls.log"
        mode: "0644"

    - name: Run install.sh --service (stdout+stderr captured for verify.yml)
      # set +e: a non-zero exit is asserted in verify.yml, not here.
      # ADAPTER_BACKEND_CONFIG is removed so the only config the service sees is
      # the one the installer generates.
      ansible.builtin.shell:
        cmd: |
          set +e
          env -u ADAPTER_BACKEND_CONFIG \
              ADAPTER_SERVICE_BACKEND_BASE="{{ backend_base }}" \
              ADAPTER_SERVICE_BACKEND_KEY="{{ backend_key }}" \
              PATH="{{ stub_bin_dir }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
              bash {{ stage_dir }}/install.sh --service > {{ install_log }} 2>&1
          printf '%s' "$?" > {{ install_rc }}
        executable: /bin/bash
      changed_when: true

    - name: Show the installer output in the molecule log
      ansible.builtin.command: cat {{ install_log }}
      changed_when: false
