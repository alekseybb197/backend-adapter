name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Гейт по путям: каждый дорогой job гоняется только на правках «своей»
  # части репозитория. Фильтр считает diff текущего PR/push, а сам job
  # изменения не вносит — потому это отдельный лёгкий job, а не paths: на
  # уровне workflow (тот отключил бы сразу ВСЕ джобы).
  #
  # Три фильтра:
  #   install — установщик: сценарии molecule копируют корневой install.sh
  #             (molecule/*/prepare.yml) и проверяют сами себя;
  #   code    — код приложения + тесты + конфиги, влияющие на прогон
  #             (pyproject.toml, pytest.ini, requirements*.txt): линт, типы,
  #             юнит-тесты;
  #   runtime — то, что попадает в сборку/установку пакета: smoke-проверки
  #             установки и WEBUI (tests/** и pytest.ini на них не влияют).
  #
  # ВНИМАНИЕ: при правках вне этих путей соответствующий job получает статус
  # skipped. Если job объявлен required в branch-protection, это заблокирует
  # merge — настройку правил нужно вести осознанно (проще всего требовать
  # только те job'ы, которые не гейтятся, либо учитывать skipped явно).
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # dorny/paths-filter читает список изменённых файлов PR через API — на
    # pull_request ему нужен pull-requests: read. Права заданы на уровне job,
    # чтобы не менять их для остальных джобов.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      install: ${{ steps.filter.outputs.install }}
      code: ${{ steps.filter.outputs.code }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - name: Checkout
        # fetch-depth: 0 — на push paths-filter сравнивает github.event.before
        # с github.sha, и базовый коммит должен быть в локальной истории;
        # при дефолтной глубине 1 (и 2 на многокоммитном push) его нет.
        # На pull_request action идёт через API и глубины не требует.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            install:
              - 'install.sh'
              - 'molecule/**'
            code:
              - 'backend_adapter/**'
              - 'backend-adapter.py'
              - 'tests/**'
              - 'pyproject.toml'
              - 'pytest.ini'
              - 'requirements*.txt'
            runtime:
              - 'backend_adapter/**'
              - 'backend-adapter.py'
              - 'pyproject.toml'
              - 'requirements*.txt'

  lint-and-typecheck:
    name: Lint & Type Check
    # Гейт: ruff/mypy идут по backend_adapter/ + backend-adapter.py, а их
    # настройки и версии инструментов живут в pyproject.toml/requirements* —
    # фильтр `code` покрывает и то, и другое, и тесты.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run ruff (lint + format check)
        run: |
          ruff check backend_adapter/ backend-adapter.py
          ruff format --check backend_adapter/ backend-adapter.py

      - name: Run mypy
        # Тот же набор, что локальная проверка перед коммитом (CLAUDE.md):
        # mypy --strict --ignore-missing-imports по пакету и точке входа.
        # Конфиг pyproject.toml ([tool.mypy]) задаёт НЕ-strict режим, но
        # disable_error_code там всё ещё действует; strict-ошибки в пакете
        # починены, поэтому CI гоняет strict, как и локально.
        run: |
          mypy --strict --ignore-missing-imports backend_adapter/ backend-adapter.py

  test:
    name: Test
    # Гейт `code`: прогон имеет смысл только при правках кода, тестов или
    # конфигов, влияющих на их запуск (pyproject.toml, pytest.ini,
    # requirements*.txt).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest --cov=backend_adapter --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  install-smoke-test:
    name: Install Smoke Test
    # Гейт `runtime`: проверяется `pip install -e .` и импорт пакета, поэтому
    # достаточно путей, попадающих в сборку (тесты и pytest.ini не влияют).
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install from source
        run: |
          pip install -e .
          backend-adapter --help 2>/dev/null || true

      - name: Check entry point works
        run: |
          python -c "import importlib; m = importlib.import_module('backend_adapter.cli'); assert callable(m.main); print('CLI entry point OK')"
          python -c "from backend_adapter.config import PROXY_PORT; print('Config import OK')"

  install-molecule:
    name: Install Script (molecule, docker)
    # Гейт по путям (job `changes` выше): molecule-сценарии читают install.sh
    # и molecule/**, поэтому запускаются только когда эти пути затронуты.
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install molecule
        # molecule is not part of requirements-dev.txt — it is needed only for
        # this scenario (see molecule/requirements-molecule.txt).
        run: |
          python -m pip install --upgrade pip
          pip install -r molecule/requirements-molecule.txt

      - name: Show docker info
        run: docker version

      - name: Run molecule scenario
        # The scenario never reaches github.com: a PATH stub for curl
        # fabricates the release asset and records the requested URL.
        # -s install is required — the scenario is not named "default".
        run: molecule test -s install
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'

      - name: Run molecule service scenario
        # `install.sh --service` installs a SYSTEM systemd unit and asserts it
        # actually starts (is-active=active), so the scenario needs a container
        # running systemd as PID 1 — hence a privileged container with the host
        # cgroup namespace (see molecule/service/molecule.yml). The GitHub
        # runner is a systemd host with cgroup v2, so this works there.
        run: molecule test -s service
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'

  webui-smoke:
    name: WEBUI Smoke Test
    # Гейт `runtime`: smoke-проверка поднимает WEBUI-ядро, которое импортирует
    # почти весь базовый пакет (config, logger, redact, session_log,
    # model_usage, artifact_tree*, probe_json). Узкий список webui-модулей дал
    # бы ложные пропуски при правке базового модуля — это опасная сторона
    # (поломка не поймана), тогда как лишний прогон стоит ~30 с.
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Serve WEBUI and probe endpoints
        run: |
          mkdir -p smoke-log-dir
          python -m backend_adapter.webserver smoke-log-dir --port 8799 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8799/; then break; fi
            sleep 0.5
          done
          echo "GET /          -> $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/)"
          echo "GET /session   -> $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/session)"
          echo "GET /nope      -> $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/nope)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/session)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/nope)" = "404"
