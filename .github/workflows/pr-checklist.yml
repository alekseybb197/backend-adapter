name: PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-pr-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR has description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const required = ['## Description', '## Changes'];
            const hasDescription = body.length > 50;
            if (!hasDescription) {
              core.setFailed('PR description is too short. Please describe what this PR does.');
            }
