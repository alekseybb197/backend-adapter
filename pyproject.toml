[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend-adapter"
version = "0.8.1"
description = "Claude Code ↔ OpenAI Backend Proxy Adapter"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Aleksey Barabanov", email = "alekseybb@gmail.com"},
]
keywords = [
    "claude-code", "anthropic", "openai", "proxy", "adapter",
    "llm", "api", "streaming", "sse"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/alekseybb197/backend-adapter"
Repository = "https://github.com/alekseybb197/backend-adapter"
Issues = "https://github.com/alekseybb197/backend-adapter/issues"
Changelog = "https://github.com/alekseybb197/backend-adapter/blob/main/changelog.md"

[project.scripts]
backend-adapter = "backend_adapter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend_adapter"]

[tool.hatch.build.targets.sdist]
include = [
    "backend_adapter/",
    "backend-adapter.py",
    "backend-adapter.service",
    "com.user.backend-adapter.plist",
    "backend-adapter.env",
    "sample.adapter.env",
    "adapter.yaml",
    "requirements.txt",
    "docs/",
]

# ── Ruff configuration ──
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B007",  # unused loop control variable (kept intentionally in some helpers)
]
[tool.ruff.lint.per-file-ignores]
# WEBUI endpoint methods `GET`/`POST` mirror BaseHTTPRequestHandler dispatch
# names, not regular functions; backend-adapter.py re-exports config globals
# used only for their side effects, so unused imports are intentional there.
"backend_adapter/webserver.py" = ["N802"]
"backend_adapter/webui_status.py" = ["N802"]
"backend_adapter/session_viewer.py" = ["N802"]
"backend_adapter/webui_config_api.py" = ["N802"]
"backend-adapter.py" = ["F401", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy configuration ──
[tool.mypy]
python_version = "3.10"
# Репозиторий исторически строго не типизирован, поэтому `strict = true`
# здесь НЕ стоит: базовые ошибки типов ловим, а постепенная строгая
# типизация модулей — отдельная задача. Грубые категории шума, которые
# сыплются от непроаннотированного legacy-кода, отключены точечно:
# `assignment`/`comparison-overlap` — это реальные сигналы в server.py,
# требующие осознанного рефакторинга, поэтому из списка исключены;
# `no-any-return`/`type-arg`/`misc` и пр. — шум от модулей без аннотаций.
follow_imports = "skip"
ignore_missing_imports = true
show_error_codes = true
allow_untyped_defs = true
allow_untyped_calls = true
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "type-arg",
    "no-any-return",
    "misc",
    "unused-ignore",
    "import-untyped",
    "var-annotated",
    "arg-type",
]

# ── Pytest configuration ──
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
